      - name: Save learned weights to the repository
        if: hashFiles('model.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json
          git commit -m "Train littleGPT v4: ${{ inputs.steps || '20000' }} CPU steps" || echo "No model changes"
          git pull --rebase origin main
          git push

      - name: Upload final model backup
        if: always() && hashFiles('model.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: littleGPT-v4-model
          path: model.json
          retention-days: 14
