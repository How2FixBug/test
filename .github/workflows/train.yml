name: Train littleGPT

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps"
        required: true
        default: "5000"
        type: choice
        options:
          - "3000"
          - "5000"
          - "7000"

permissions:
  contents: write

concurrency:
  group: little-gpt-training
  cancel-in-progress: false

jobs:
  train:
    name: Train littleGPT v3 with resumable checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Restore latest checkpoint
        uses: actions/cache/restore@v4
        with:
          path: checkpoint.pt
          key: littlegpt-checkpoint-${{ github.run_id }}-initial
          restore-keys: |
            littlegpt-checkpoint-

      - name: Train checkpoint chunk 1
        uses: ./.github/actions/train-chunk
        with:
          chunk: "1"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 2
        uses: ./.github/actions/train-chunk
        with:
          chunk: "2"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 3
        uses: ./.github/actions/train-chunk
        with:
          chunk: "3"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 4
        uses: ./.github/actions/train-chunk
        with:
          chunk: "4"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 5
        uses: ./.github/actions/train-chunk
        with:
          chunk: "5"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 6
        uses: ./.github/actions/train-chunk
        with:
          chunk: "6"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 7
        uses: ./.github/actions/train-chunk
        with:
          chunk: "7"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 8
        uses: ./.github/actions/train-chunk
        with:
          chunk: "8"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 9
        uses: ./.github/actions/train-chunk
        with:
          chunk: "9"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 10
        uses: ./.github/actions/train-chunk
        with:
          chunk: "10"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 11
        uses: ./.github/actions/train-chunk
        with:
          chunk: "11"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 12
        uses: ./.github/actions/train-chunk
        with:
          chunk: "12"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 13
        uses: ./.github/actions/train-chunk
        with:
          chunk: "13"
          total_steps: ${{ inputs.steps || '5000' }}
      - name: Train checkpoint chunk 14
        uses: ./.github/actions/train-chunk
        with:
          chunk: "14"
          total_steps: ${{ inputs.steps || '5000' }}

      - name: Save learned weights to the repository
        if: hashFiles('model.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json
          git commit -m "Train littleGPT v3: ${{ inputs.steps || '5000' }} CPU steps" || echo "No model changes"
          git pull --rebase origin main
          git push

      - name: Upload final model backup
        if: always() && hashFiles('model.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: littleGPT-v3-model
          path: model.json
          retention-days: 14
