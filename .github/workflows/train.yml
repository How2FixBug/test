name: Train littleGPT

on:
  push:
    paths:
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (more steps = longer training)"
        required: true
        default: "5000"
        type: choice
        options:
          - "3000"
          - "5000"
          - "7000"

permissions:
  contents: write

concurrency:
  group: little-gpt-training
  cancel-in-progress: false

jobs:
  train:
    name: Train littleGPT v3 from scratch (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train on TinyStories
        env:
          TRAIN_STEPS: ${{ inputs.steps || '5000' }}
          DATASET_ROWS: "6000"
        run: python train.py

      - name: Save learned weights to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json
          git commit -m "Train littleGPT v3: ${{ inputs.steps || '5000' }} CPU steps" || echo "No model changes"
          git pull --rebase origin main
          git push

      - name: Upload model backup
        if: always() && hashFiles('model.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: littleGPT-v3-model
          path: model.json
          retention-days: 14
