name: Train littleGPT

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps"
        required: true
        default: "20000"
        type: choice
        options:
          - "10000"
          - "20000"
          - "30000"

permissions:
  contents: write

concurrency:
  group: little-gpt-training
  cancel-in-progress: false

jobs:
  train:
    name: Train littleGPT v4 with resumable checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Restore v4 dataset cache
        id: dataset-cache
        uses: actions/cache/restore@v4
        with:
          path: training_stories.json
          key: littlegpt-v4-dataset-30000

      - name: Restore v4 training checkpoint
        uses: actions/cache/restore@v4
        with:
          path: checkpoint.pt
          key: littlegpt-v4-checkpoint-${{ github.run_id }}-initial
          restore-keys: |
            littlegpt-v4-checkpoint-

      - name: Train checkpoint chunk 1
        uses: ./.github/actions/train-chunk
        with:
          chunk: "1"
          total_steps: ${{ inputs.steps || '20000' }}

      - name: Save v4 dataset cache
        if: steps.dataset-cache.outputs.cache-hit != 'true' && hashFiles('training_stories.json') != ''
        uses: actions/cache/save@v4
        with:
          path: training_stories.json
          key: littlegpt-v4-dataset-30000

      - name: Train checkpoint chunk 2
        uses: ./.github/actions/train-chunk
        with:
          chunk: "2"
          total_steps: ${{ inputs.steps || '20000' }}

      - name: Train checkpoint chunk 3
