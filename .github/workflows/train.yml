name: Train littleGPT

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps"
        required: true
        default: "3000"
        type: choice
        options:
          - "2000"
          - "3000"
          - "4000"

permissions:
  contents: write

concurrency:
  group: little-gpt-training
  cancel-in-progress: false

jobs:
  train:
    name: Train littleGPT v5 fast with resumable checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Restore v4 dataset cache
        id: dataset-cache
        uses: actions/cache/restore@v4
        with:
          path: training_stories.json
          key: littlegpt-v4-dataset-${{ github.run_id }}
          restore-keys: |
            littlegpt-v4-dataset-

      - name: Restore v5 training checkpoint
        uses: actions/cache/restore@v4
        with:
          path: checkpoint.pt
          key: littlegpt-v5-checkpoint-${{ github.run_id }}-initial
          restore-keys: |
            littlegpt-v5-checkpoint-

      - name: Train checkpoint chunk 1
        uses: ./.github/actions/train-chunk
        with:
          chunk: "1"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 2
        uses: ./.github/actions/train-chunk
        with:
          chunk: "2"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 3
        uses: ./.github/actions/train-chunk
        with:
          chunk: "3"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 4
        uses: ./.github/actions/train-chunk
        with:
          chunk: "4"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 5
        if: inputs.steps != '2000'
        uses: ./.github/actions/train-chunk
        with:
          chunk: "5"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 6
        if: inputs.steps != '2000'
        uses: ./.github/actions/train-chunk
        with:
          chunk: "6"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 7
        if: inputs.steps == '4000'
        uses: ./.github/actions/train-chunk
        with:
          chunk: "7"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Train checkpoint chunk 8
        if: inputs.steps == '4000'
        uses: ./.github/actions/train-chunk
        with:
          chunk: "8"
          total_steps: ${{ inputs.steps || '3000' }}

      - name: Save learned weights to the repository
        if: hashFiles('model.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json
          git commit -m "Train littleGPT v5: ${{ inputs.steps || '20000' }} CPU steps" || echo "No model changes"
          git pull --rebase origin main
          git push

      - name: Upload final model backup
        if: success() && hashFiles('model.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: littleGPT-v4-model
          path: model.json
          retention-days: 14
