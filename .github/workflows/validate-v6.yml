name: Validate littleGPT v6

on:
  push:
    branches: [main]
    paths:
      - "train_v6.py"
      - ".github/workflows/train-v6.yml"
      - ".github/actions/train-v6-chunk/action.yml"
      - ".github/workflows/validate-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m py_compile train_v6.py

      - name: Check workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f, aliases: true); puts "Valid YAML: #{f}" }' \
            .github/workflows/train-v6.yml \
            .github/actions/train-v6-chunk/action.yml
