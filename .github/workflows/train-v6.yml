name: Train littleGPT v6

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Total training steps"
        required: true
        default: "30000"
        type: choice
        options:
          - "10000"
          - "20000"
          - "30000"

permissions:
  contents: write

concurrency:
  group: little-gpt-training
  cancel-in-progress: false

jobs:
  train:
    name: Train littleGPT v6 (packed data, MPS-ready)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Restore v4 dataset cache
        uses: actions/cache/restore@v4
        with:
          path: training_stories.json
          key: littlegpt-v4-dataset-${{ github.run_id }}
          restore-keys: |
            littlegpt-v4-dataset-

      - name: Restore v6 checkpoint for this run
        uses: actions/cache/restore@v4
        with:
          path: checkpoint.pt
          key: littlegpt-v6-checkpoint-${{ github.run_id }}-initial
          restore-keys: |
            littlegpt-v6-checkpoint-${{ github.run_id }}-

      - name: Train chunk 1
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "1"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Save v4 dataset cache
        if: always() && hashFiles('training_stories.json') != ''
        uses: actions/cache/save@v4
        with:
          path: training_stories.json
          key: littlegpt-v4-dataset-${{ github.run_id }}

      - name: Train chunk 2
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "2"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 3
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "3"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 4
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "4"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 5
        if: ${{ inputs.steps == '20000' || inputs.steps == '30000' || inputs.steps == '' }}
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "5"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 6
        if: ${{ inputs.steps == '20000' || inputs.steps == '30000' || inputs.steps == '' }}
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "6"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 7
        if: ${{ inputs.steps == '20000' || inputs.steps == '30000' || inputs.steps == '' }}
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "7"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 8
        if: ${{ inputs.steps == '30000' || inputs.steps == '' }}
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "8"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 9
        if: ${{ inputs.steps == '30000' || inputs.steps == '' }}
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "9"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Train chunk 10
        if: ${{ inputs.steps == '30000' || inputs.steps == '' }}
        uses: ./.github/actions/train-v6-chunk
        with:
          chunk: "10"
          total_steps: ${{ inputs.steps || '30000' }}

      - name: Save learned weights to the repository
        if: hashFiles('model.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.json
          git commit -m "Train littleGPT v6: ${{ inputs.steps || '30000' }} steps" || echo "No model changes"
          git pull --rebase origin main
          git push

      - name: Upload final model backup
        if: success() && hashFiles('model.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: littleGPT-v6-model
          path: model.json
          retention-days: 14
