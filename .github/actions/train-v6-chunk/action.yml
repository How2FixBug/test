name: Train one littleGPT v6 checkpoint chunk
description: Train a v6 chunk and persist its resumable checkpoint
inputs:
  chunk:
    description: Unique chunk number for the cache key
    required: true
  total_steps:
    description: Total training steps
    required: true
runs:
  using: composite
  steps:
    - name: Train next chunk
      shell: bash
      env:
        TRAIN_STEPS: ${{ inputs.total_steps }}
        CHUNK_STEPS: "3000"
        DATASET_ROWS: "30000"
        PROFILE_STEPS: "10"
      run: python train_v6.py

    - name: Persist checkpoint
      if: always() && hashFiles('checkpoint-v6.pt') != ''
      uses: actions/cache/save@v4
      with:
        path: checkpoint-v6.pt
        key: littlegpt-v6-checkpoint-${{ github.run_id }}-${{ inputs.chunk }}
