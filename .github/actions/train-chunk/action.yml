name: Train one littleGPT checkpoint chunk
description: Train a chunk and persist its resumable checkpoint
inputs:
  chunk:
    description: Unique chunk number for the cache key
    required: true
  total_steps:
    description: Total training steps
    required: true
runs:
  using: composite
  steps:
    - name: Train next chunk
      shell: bash
      env:
        TRAIN_STEPS: ${{ inputs.total_steps }}
        CHUNK_STEPS: "500"
      run: python train.py

    - name: Persist checkpoint
      if: always() && hashFiles('checkpoint.pt') != ''
      uses: actions/cache/save@v4
      with:
        path: checkpoint.pt
        key: littlegpt-checkpoint-${{ github.run_id }}-${{ inputs.chunk }}
