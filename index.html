<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roger AI</title>
<style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#101a30;--line:#243653;--blue:#4e8cff;--text:#edf4ff;--muted:#91a4c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:250px 1fr}
aside{background:#0d172a;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:850;font-size:21px;letter-spacing:-.7px}.brand span{color:#73a5ff}
button{border:0;border-radius:11px;padding:11px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
#new{width:100%;background:#172947;border:1px solid #2a4772;text-align:left}.small{font-size:12px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;height:100vh}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}
#status{font-size:12px;color:var(--muted)}#messages{flex:1;overflow:auto;padding:32px max(22px,calc((100% - 800px)/2));display:flex;flex-direction:column;gap:20px}
.welcome{margin:auto;text-align:center;max-width:520px}.welcome h1{font-size:34px;letter-spacing:-1.4px;margin:0 0 8px}.welcome p{color:var(--muted)}
.msg{max-width:100%;padding:15px 17px;border:1px solid var(--line);border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#172c4c;border-color:#294b7a;max-width:85%}.assistant{align-self:flex-start;background:var(--panel);max-width:90%}
.composer{padding:18px max(22px,calc((100% - 800px)/2)) 24px;border-top:1px solid var(--line)}.entry{display:flex;gap:10px;background:var(--panel);border:1px solid #2b4162;border-radius:15px;padding:8px}
textarea{flex:1;resize:none;min-height:44px;max-height:150px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px}#send{align-self:flex-end}
@media(max-width:650px){body{grid-template-columns:1fr}aside{display:none}.top{padding:0 16px}#messages{padding:22px 14px}.composer{padding:12px}}
</style>
</head>
<body>
<aside><div class="brand">roger<span>AI</span></div><button id="new">＋ New chat</button><div class="small">CUSTOM MODEL · LOCAL FIRST</div><div style="margin-top:auto" class="small">Your conversations stay on this computer.</div></aside>
<main><header class="top"><strong>Chat</strong><span id="status">Checking model…</span></header>
<section id="messages"><div class="welcome" id="welcome"><h1>What's on your mind?</h1><p>A chatbot built from its own model, trained from scratch.</p></div></section>
<footer class="composer"><div class="entry"><textarea id="input" placeholder="Message Roger AI…" rows="1"></textarea><button id="send">Send</button></div><div class="small" style="padding:8px 4px 0">Early model · quality depends on the training data</div></footer></main>
<script>
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),send=document.querySelector('#send'),statusEl=document.querySelector('#status');
let history=[];
function add(role,text){document.querySelector('#welcome')?.remove();const el=document.createElement('div');el.className='msg '+role;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}
async function status(){try{const r=await fetch('/api/status');const s=await r.json();statusEl.textContent=s.ready?'Model ready · '+s.device:(s.error||'Model unavailable');statusEl.style.color=s.ready?'#7dd9a5':'#ffbf70';send.disabled=!s.ready}catch{statusEl.textContent='Start app.py to connect';send.disabled=true}}
async function submit(){const message=input.value.trim();if(!message||send.disabled)return;input.value='';add('user',message);const pending=add('assistant','Thinking…');send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');pending.textContent=data.answer;history.push({user:message,assistant:data.answer});history=history.slice(-6)}catch(e){pending.textContent='Error: '+e.message}finally{send.disabled=false;input.focus();messages.scrollTop=messages.scrollHeight}}
send.addEventListener('click',submit);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});document.querySelector('#new').addEventListener('click',()=>{history=[];messages.innerHTML='<div class="welcome" id="welcome"><h1>Fresh conversation.</h1><p>What should we explore?</p></div>'});status();
</script></body></html>
