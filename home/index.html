<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Astra — your corner of the cosmos.">
  <title>ASTRA</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.all.min.js" defer></script>
  <script src="tokenizer.js" defer></script>
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="space-backdrop" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><img src="assets/icons/brand-orbit.svg" alt=""></div>
        <div><span class="brand-name">ASTRA</span></div>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <img class="ui-icon" src="assets/icons/plus.svg" alt="" aria-hidden="true"><span>New chat</span><kbd>CTRL K</kbd>
      </button>
      <div class="history-heading"><span>FLIGHT LOGS</span><span class="history-count" id="chat-count">0</span></div>
      <nav class="chat-list" id="chat-list" aria-label="Conversations"></nav>
          </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Toggle sidebar" type="button"><img class="ui-icon" src="assets/icons/menu.svg" alt="" aria-hidden="true"></button>
        <div class="topbar-actions">
          <div class="edit-menu-wrap">
            <button class="icon-button" id="edit-chat-button" type="button" aria-label="Edit chat" aria-expanded="false">
              <img class="ui-icon" src="assets/icons/edit.svg" alt="" aria-hidden="true">
              <span class="button-tooltip">Edit Chat</span>
            </button>
            <div class="edit-menu" id="edit-chat-menu" hidden>
              <button type="button" data-action="rename"><img class="ui-icon" src="assets/icons/edit.svg" alt="" aria-hidden="true">Rename</button>
              <button type="button" data-action="delete"><img class="ui-icon" src="assets/icons/trash.svg" alt="" aria-hidden="true">Delete</button>
            </div>
          </div>
          <button class="icon-button" id="settings-button" type="button" aria-label="Settings">
            <img class="ui-icon" src="assets/icons/settings.svg" alt="" aria-hidden="true">
            <span class="button-tooltip">Settings</span>
          </button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="nebula-frame" aria-hidden="true">
          <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1800&q=90" alt="">
          <div class="nebula-shade"></div>
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
        </div>
        <div class="welcome-scene" id="welcome-scene">
          <div class="welcome-layout">
<div class="welcome-copy">
<h1>A quieter space<br>to think.</h1>
<p>Ask a question, explore an idea, or pick up where you left off.</p>
</div>
<aside class="explore-panel" aria-label="Ideas to explore">
<button class="idea-card" type="button" data-prompt="Explain a fascinating fact about the universe."><span class="idea-symbol">✧</span><span><strong>Beyond the stars</strong><small>Discover something cosmic</small></span><span class="idea-arrow">↗</span></button>
<button class="idea-card" type="button" data-prompt="Teach me something surprising in a simple way."><span class="idea-symbol">⌘</span><span><strong>Surprise me</strong><small>Learn something unexpected</small></span><span class="idea-arrow">↗</span></button>
<button class="idea-card" type="button" data-prompt="Help me think through an idea I have."><span class="idea-symbol">◌</span><span><strong>Explore an idea</strong><small>Start with a passing thought</small></span><span class="idea-arrow">↗</span></button>
</aside>
</div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
    <div class="model-picker-wrap" id="model-picker-wrap">
      <button class="model-picker" id="model-picker" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="model-picker-mark" aria-hidden="true"></span>
        <span class="model-picker-copy"><strong id="selected-model-name">ASTRA 0.1</strong><small id="selected-model-status">Model files not added</small></span>
        <span class="model-picker-chevron" aria-hidden="true">⌃</span>
      </button>
      <div class="model-menu" id="model-menu" role="listbox" aria-label="Choose a model" hidden>
        <div class="model-menu-heading">AVAILABLE MODELS</div>
        <button class="model-option selected" type="button" role="option" aria-selected="true" data-model="astra-0.1">
          <span class="model-option-mark" aria-hidden="true"></span>
          <span><strong>ASTRA 0.1</strong><small>10.4M parameters · Browser model</small></span>
          <span class="model-option-check" aria-hidden="true">✓</span>
        </button>
        <div class="model-menu-note">More models will appear here as they are added.</div>
      </div>
    </div>
        <form class="composer-shell" id="chat-form">
          <div class="input-box">
            <textarea id="message-input" rows="1" placeholder="Message ASTRA..." aria-label="Message Astra" autocomplete="off"></textarea>
          </div>
          <button class="send-button" type="submit" aria-label="Send message"><img class="ui-icon" src="assets/icons/send.svg" alt="" aria-hidden="true"></button>
        </form>
      </footer>
    </main>
  </div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="Close">
        <img class="ui-icon" src="assets/icons/close.svg" alt="" aria-hidden="true">
      </button>
      <h2 id="modal-title">Edit conversation</h2>
      <div class="modal-content" id="modal-content"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
