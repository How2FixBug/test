<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Astra — your corner of the cosmos.">
  <title>ASTRA</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="space-backdrop" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="6"/><ellipse cx="20" cy="20" rx="17" ry="7" transform="rotate(-28 20 20)"/><circle cx="33.5" cy="12" r="2.3"/></svg></div>
        <div><span class="brand-name">ASTRA</span></div>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span><kbd>CTRL K</kbd>
      </button>
      <div class="history-heading"><span>YOUR CONVERSATIONS</span><span class="history-count" id="chat-count">0</span></div>
      <nav class="chat-list" id="chat-list" aria-label="Conversations"></nav>
          </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Toggle sidebar" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="topbar-actions">
          <div class="edit-menu-wrap">
            <button class="icon-button" id="edit-chat-button" type="button" aria-label="Edit chat" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
              <span class="button-tooltip">Edit Chat</span>
            </button>
            <div class="edit-menu" id="edit-chat-menu" hidden>
              <button type="button" data-action="rename"><svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.2-.9L19 8.3 15.7 5 4.9 15.8 4 20Z"/></svg>Rename</button>
              <button type="button" data-action="delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7"/></svg>Delete</button>
            </div>
          </div>
          <button class="icon-button" id="settings-button" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z"/><path d="m19.4 15 .05.05 1.1.86-1.1 1.9-1.35-.48a7.7 7.7 0 0 1-1.7.98l-.25 1.44h-2.2l-.25-1.44a7.7 7.7 0 0 1-1.7-.98l-1.35.48-1.1-1.9 1.1-.86a7.7 7.7 0 0 1 0-1.96l-1.1-.86 1.1-1.9 1.35.48a7.7 7.7 0 0 1 1.7-.98l.25-1.44h2.2l.25 1.44a7.7 7.7 0 0 1 1.7.98l1.35-.48 1.1 1.9-1.1.86a7.7 7.7 0 0 1 0 1.96Z" transform="translate(-1.2 -1.05) scale(1.1)"/></svg>
            <span class="button-tooltip">Settings</span>
          </button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome-scene" id="welcome-scene">
          <div class="nebula-frame" aria-hidden="true">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1800&q=90" alt="">
            <div class="nebula-shade"></div>
            <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          </div>
          <div class="welcome-copy"><h1>EXPLORE THE UNIVERSE</h1></div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
        <form class="composer-shell" id="chat-form">
          <div class="input-box">
            <textarea id="message-input" rows="1" placeholder="Message ASTRA..." aria-label="Message Astra" autocomplete="off"></textarea>
          </div>
          <button class="send-button" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
        </form>
      </footer>
    </main>
  </div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="modal-title">Edit conversation</h2>
      <div class="modal-content" id="modal-content"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
