<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Sol — a little corner of the cosmos.">
  <title>Sol</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="space-backdrop" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="6"/><ellipse cx="20" cy="20" rx="17" ry="7" transform="rotate(-28 20 20)"/><circle cx="33.5" cy="12" r="2.3"/></svg></div>
        <div><span class="brand-name">SOL</span></div>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span><kbd>CTRL K</kbd>
      </button>
      <div class="history-heading"><span>YOUR CONVERSATIONS</span><span class="history-count" id="chat-count">0</span></div>
      <nav class="chat-list" id="chat-list" aria-label="Conversations"></nav>
      <div class="sidebar-bottom">
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Toggle sidebar" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="breadcrumb"><span>SPACE</span><i></i><strong>CONVERSATION</strong></div>
        <div class="topbar-right"><span class="status-dot"></span><span>SOL SYSTEM</span><span class="topbar-divider"></span><span class="version">PREVIEW 01</span></div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome-scene" id="welcome-scene">
          <div class="nebula-frame" aria-hidden="true">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1800&q=90" alt="">
            <div class="nebula-shade"></div>
            <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
            <span class="scene-coordinate">28° 23′  ·  DEEP SPACE</span>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="chat-form">
          <textarea id="message-input" rows="1" placeholder="Send a message into the cosmos..." aria-label="Message Sol" autocomplete="off"></textarea>
          <button class="send-button" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
        </form>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
