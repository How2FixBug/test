<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Astra — your corner of the cosmos.">
  <title>ASTRA</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="space-backdrop" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><img src="assets/icons/brand-orbit.svg" alt=""></div>
        <div><span class="brand-name">ASTRA</span></div>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <img class="ui-icon" src="assets/icons/plus.svg" alt="" aria-hidden="true"><span>New chat</span><kbd>CTRL K</kbd>
      </button>
      <div class="history-heading"><span>YOUR CONVERSATIONS</span><span class="history-count" id="chat-count">0</span></div>
      <nav class="chat-list" id="chat-list" aria-label="Conversations"></nav>
          </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Toggle sidebar" type="button"><img class="ui-icon" src="assets/icons/menu.svg" alt="" aria-hidden="true"></button>
        <div class="topbar-actions">
          <div class="edit-menu-wrap">
            <button class="icon-button" id="edit-chat-button" type="button" aria-label="Edit chat" aria-expanded="false">
              <img class="ui-icon" src="assets/icons/edit.svg" alt="" aria-hidden="true">
              <span class="button-tooltip">Edit Chat</span>
            </button>
            <div class="edit-menu" id="edit-chat-menu" hidden>
              <button type="button" data-action="rename"><img class="ui-icon" src="assets/icons/edit.svg" alt="" aria-hidden="true">Rename</button>
              <button type="button" data-action="delete"><img class="ui-icon" src="assets/icons/trash.svg" alt="" aria-hidden="true">Delete</button>
            </div>
          </div>
          <button class="icon-button" id="settings-button" type="button" aria-label="Settings">
            <img class="ui-icon" src="assets/icons/settings.svg" alt="" aria-hidden="true">
            <span class="button-tooltip">Settings</span>
          </button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome-scene" id="welcome-scene">
          <div class="nebula-frame" aria-hidden="true">
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1800&q=90" alt="">
            <div class="nebula-shade"></div>
            <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          </div>
          <div class="welcome-copy"><h1>EXPLORE THE UNIVERSE</h1></div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
        <form class="composer-shell" id="chat-form">
          <div class="input-box">
            <textarea id="message-input" rows="1" placeholder="Message ASTRA..." aria-label="Message Astra" autocomplete="off"></textarea>
          </div>
          <button class="send-button" type="submit" aria-label="Send message"><img class="ui-icon" src="assets/icons/send.svg" alt="" aria-hidden="true"></button>
        </form>
      </footer>
    </main>
  </div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="Close">
        <img class="ui-icon" src="assets/icons/close.svg" alt="" aria-hidden="true">
      </button>
      <h2 id="modal-title">Edit conversation</h2>
      <div class="modal-content" id="modal-content"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
